name: Validate workflow

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavior regressions
        run: python3 scripts/test.py --junitxml "$RUNNER_TEMP/workflow-tests.xml"
      - name: Verify release source and upstream provenance
        run: python3 scripts/check_release.py
      - name: Fetch the exact independent CS dependency
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          dependency = json.loads(Path('dependencies.json').read_text())['cs']
          target = Path(os.environ['RUNNER_TEMP']) / 'workflow-cs'
          subprocess.run(['git', 'clone', '--no-checkout', dependency['repository'], str(target)], check=True)
          subprocess.run(['git', '-C', str(target), 'checkout', '--detach', dependency['source_commit']], check=True)
          PY
      - name: Verify real CS integration against locked contents
        run: python3 scripts/check_cs.py --cs-skill "$RUNNER_TEMP/workflow-cs/skills/cs"
      - name: Build the distributable plugin
        run: python3 scripts/package.py --output "$RUNNER_TEMP/team-workflow.zip"
