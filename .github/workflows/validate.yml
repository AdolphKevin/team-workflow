name: Validate workflow

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavior regressions
        id: results
        run: python3 scripts/ci_result.py
      - name: Preserve execution-time source and native reports
        if: ${{ always() && steps.results.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-python-${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.results.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
      - name: Verify release source and upstream provenance
        run: python3 scripts/check_release.py
      - name: Fetch independent CS default branch
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'workflow-cs'
          subprocess.run(['git', 'clone', '--depth', '1', 'https://github.com/AdolphKevin/codestable-compact.git', str(target)], check=True)
          subprocess.run(['git', '-C', str(target), 'rev-parse', 'HEAD'], check=True)
          PY
      - name: Verify real CS public interfaces
        run: python3 scripts/check_cs.py --cs-skill "$RUNNER_TEMP/workflow-cs/skills/cs"
      - name: Verify v4 against real CS capabilities
        run: python3 scripts/check_cs_v4.py --cs-skill "$RUNNER_TEMP/workflow-cs/skills/cs"
      - name: Verify parallel branches with real CS
        run: python3 scripts/check_parallel.py --cs-skill "$RUNNER_TEMP/workflow-cs/skills/cs"
      - name: Build the distributable plugin
        run: python3 scripts/package.py --output "$RUNNER_TEMP/team-workflow.zip"
