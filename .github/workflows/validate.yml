name: Validate workflow

on:
  push:
    branches: [main, 'codex/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavior regressions
        id: results
        run: python3 scripts/ci_result.py
      - name: Preserve execution-time source and native reports
        if: ${{ always() && steps.results.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-python-${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.results.outputs.directory }}
          if-no-files-found: error
          retention-days: 30
      - name: Verify release source and upstream provenance
        run: python3 scripts/check_release.py
      - name: Build the distributable plugin
        run: python3 scripts/package.py --output "$RUNNER_TEMP/team-workflow.zip"
