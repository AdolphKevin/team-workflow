# 将本例保存到项目的 docs/sop/scenarios.yaml，按实际业务填写。
metadata:
  requirement: 合成命令需求
  batch: example-01
  version: 1
  owner: 场景负责人
  sources:
    - {ref: 合成输入约定, version: v1, confirmed_by: 业务确认人}
sops:
  - id: SOP-02
    title: 输入处理
    actor: 成员
    entry: 命令行
    must: [合法输入产生结果]
    scenarios:
      - id: SOP-02-P01
        polarity: positive
        title: 合法输入产生结果
        actor: 成员
        priority: P0
        verify: cli
        initial_state: [独立临时目录]
        steps: [传入合法输入并运行命令]
        expected: [退出码为零, 输出约定结果]
        forbidden_effects: [目录外的文件变化]
      - id: SOP-02-N01
        polarity: negative
        negative_type: invalid-input
        title: 错误参数得到修正提示
        actor: 成员
        priority: P0
        verify: cli
        initial_state: [独立临时目录]
        steps: [传入错误参数并运行命令]
        expected: [退出码为一, 输出修正提示]
        forbidden_effects: [生成业务结果文件]
        regression: {manual: 终端颜色与排版由人观察, owner: 验收负责人, trigger: 发布前}
