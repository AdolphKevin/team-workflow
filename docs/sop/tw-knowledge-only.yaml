        initial_state: ["临时项目有规则 rules/a.md、教训 lessons/b.md，共享仓 b 有规则 rules/c.md 并已映射", "1.2.2 运行时取自标签 v1.2.2"]
        steps: ["tw read rules/a.md lessons/b.md b:rules/c.md", "分别用 1.2.2 与候选版运行 tw read rules/a.md", "tw read rules/a.md rules/missing.md", "tw read rules/a.md lessons/b.md --section 依据"]
        expected: ["第一条命令依次输出三个条目的全文，每个条目前有一行写明是哪个条目", "单个目标时两个版本的输出逐字节相同", "含不存在的目标时以非 0 退出并写明是哪一个", "--section 与多个目标同用时以非 0 退出，说明它只在读取一个目标时使用"]
        forbidden_effects: ["只读命令修改项目知识或本机材料"]
        evidence_hints: ["命令、退出码与完整输出；cmp 结果"]

  - id: SOP-22
