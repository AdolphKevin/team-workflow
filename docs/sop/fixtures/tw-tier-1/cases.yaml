# 测试同事 李娜 提供的用例集（2026-10-20）
test_cases:
  - id: "TC_LC_001"
    title: "访客发送文字消息，在线客服在工作台实时收到"
  - id: "TC_LC_002"
    title: "客服在工作台回复，访客在聊天窗口实时收到"
  - id: "TC_LC_003"
    title: "访客连续发送多条消息，客服按发送顺序收到"
  - id: "TC_LC_004"
    title: "两名客服在线时会话只分配给其中一名"
  - id: "TC_LC_005"
    title: "访客刷新页面后重新连接，能看到之前的会话记录"
  - id: "TC_LC_006"
    title: "店铺没有在线客服时，访客收到 AI 回复"
  - id: "TC_LC_007"
    title: "AI 回复在工作台会话中标注为 AI 回复"
  - id: "TC_LC_008"
    title: "AI 回复服务不可用时，访客看到“客服稍后回复”，会话保留待客服处理"
  - id: "TC_LC_009"
    title: "访客消息 10 分钟无人回复，客服组收到提醒"
  - id: "TC_LC_010"
    title: "10 分钟内客服已回复，不发提醒"
  - id: "TC_LC_011"
    title: "商家配置 Webhook 后，新消息推送 message.created"
  - id: "TC_LC_012"
    title: "Webhook 地址返回 500 时重试 3 次后停止"
  - id: "TC_LC_013"
    title: "客服打开其他店铺的会话链接，被拒绝"
  - id: "TC_LC_014"
    title: "访客用他人的会话编号连接，被拒绝"
  - id: "TC_LC_015"
    title: "客服登录过期后回复，提示重新登录且消息未发出"
  - id: "TC_LC_016"
    title: "网关重启后访客与客服自动重连并继续对话"
  - id: "TC_LC_017"
    title: "同一条访客消息因网络重发两次，客服只看到一条"
  - id: "TC_LC_018"
    title: "未配置 Webhook 的店铺不产生推送"
  - id: "TC_LC_101"
    title: "消息超过 2000 字时提示“消息过长”"
  - id: "TC_LC_102"
    title: "空消息或只含空格时发送按钮不可用"
  - id: "TC_LC_103"
    title: "消息前后空白字符被去除后保存"
  - id: "TC_LC_104"
    title: "表情符号按 UTF-8 原样保存与显示"
  - id: "TC_LC_105"
    title: "消息时间显示为店铺时区的 HH:mm"
  - id: "TC_LC_106"
    title: "Webhook 请求头 X-Signature 为 HMAC-SHA256 十六进制小写"
  - id: "TC_LC_107"
    title: "Webhook 请求体字段 event、shop_id、message.id、message.text、created_at（RFC 3339）"
  - id: "TC_LC_108"
    title: "Webhook 重试间隔为 1、5、25 秒"
  - id: "TC_LC_109"
    title: "AI 回复超过 500 字时截断并加省略号"
  - id: "TC_LC_110"
    title: "AI 回复请求超时 8 秒"
  - id: "TC_LC_111"
    title: "会话列表按最后一条消息时间倒序"
  - id: "TC_LC_112"
    title: "工作台未读数超过 99 时显示 99+"
