# TW-TIER-1：以 SOP 场景验收最终交付的验收场景
# 预期只依据 docs/proposals/2026-10-20-verification-tiers.md（修订 2，已批准）第 2、4 节，不依据当前实现的输出。
# 版本 1（2026-10-20）：按修订 1 编写。
# 版本 2（2026-10-20）：按修订 2 第 4 节改为 6 条场景；修订 2 由 AdolphKevin 批准。
# 版本 4（2026-10-20）：SOP-03-P01 第 4 条预期改为核对方案正文（不运行 start 时尚无交接）；细节用例的判定写明时限类细节并入结果相同的降级场景。
# 版本 3（2026-10-20）：SOP-03-P01 第 3 条预期按 AdolphKevin 对“最薄”的确认改写（方案第 6 节已确认第 4 条）；SOP-03-P01 的禁止项排除 tw 写入被忽略的 .tw/local/；明确候选版可为指定提交或安装的发行。
#
# "候选版"指本任务指定提交中的 skills/team-workflow 与 skills/team-knowledge（取出到临时目录），或由该提交的发行标签安装到本机的技能；cli 场景在临时项目中运行候选 tw。
# 技能场景的新会话以 claude -p 加 --setting-sources project,local 与 --strict-mcp-config 启动，候选技能放在临时项目的 .claude/skills/。
# "无检查项目"指一个临时 Git 项目：用候选 tw 运行 tw init --apply，.tw/config.json 中 checks 为空对象、required_checks 的 code 与 docs 为空数组，声明一个 cli 验收入口；方案含一个验收节（检查：无）与一个任务节，场景文件一个节点、两条场景（P01、N01）；方案人员中实施负责人、场景执行者、评审人各不相同。
# "在线客服需求"指 docs/sop/fixtures/tw-tier-1/requirement.md，"李娜的用例"指同目录 cases.yaml（30 条，其中 TC_LC_101–112 为字段、格式、时限与文案等细节）。

metadata:
  requirement: "以 SOP 场景验收最终交付：没有登记检查的任务按场景交付，产品变化后重跑或沿用场景，代理按标准写方案"
  batch: "tw-tier-1"
  version: 4
  owner: "AdolphKevin"
  sources:
    - ref: "docs/proposals/2026-10-20-verification-tiers.md 第 2、4 节"
      version: "修订 2（2026-10-20 批准）"
      confirmed_by: "AdolphKevin"
  tags: ["tw", "场景验收", "回归", "沿用"]

sops:

  - id: SOP-01
    title: 场景验收与交付
    actor: "实施负责人与独立执行者"
    entry: "tw team start、scenarios submit、review、accept、deliver"
    must:
      - "没有登记检查的任务以场景验收交付"
      - "场景未通过或受阻未处置时不交付"
    scenarios:

      - id: SOP-01-P01
        polarity: positive
        title: 没有登记检查的任务，场景全部通过后交付完成
        actor: 实施负责人与独立执行者
        priority: P0
        refs: ["2.5", "4"]
        verify: cli
        initial_state: ["无检查项目，方案已批准", "候选 tw 已复制到临时目录"]
        steps: ["运行 tw team start --task <任务文件> --design <方案> --approval <批准>", "独立执行者按 tw team scenarios pending 的清单执行两条场景，写结果文件后运行 tw team scenarios submit", "运行 tw team run 与 tw team review，评审人填写后 review --submit", "运行 tw team accept 与 tw team deliver --reason <理由>"]
        expected: ["start 成功且 implementation_ready 为 true", "submit 登记两条场景通过", "accept 的 business_accepted 为 true", "deliver 退出码为 0，overall_complete 为 true，摘要为“交付完成”"]
        forbidden_effects: ["任何一步要求登记检查或运行测试", "交付摘要出现回归待沉淀"]
        evidence_hints: ["每条命令原文与完整输出", "结果文件"]

      - id: SOP-01-N01
        polarity: negative
        negative_type: incomplete-input
        title: 有场景未通过或受阻未处置时拒绝交付并列出缺项
        actor: 实施负责人与独立执行者
        priority: P0
        refs: ["2.5"]
        verify: cli
        initial_state: ["无检查项目，方案已批准并开工"]
        steps: ["独立执行者提交结果：P01 为 pass，N01 为 fail", "用 tw team review 生成评审稿（不运行 run），评审人各项结论填“通过”后提交", "运行 tw team deliver --reason <理由>", "在另一个同样的项目中把 N01 提交为 blocked（finding Q1），评审中 Q1 保持 open，再运行 deliver"]
        expected: ["两次 deliver 退出码均非 0，overall_complete 为 false", "第一次输出点名 N01 为 failed", "第二次输出点名 N01 受阻且问题 Q1 需要 accepted 或 deferred 处置"]
        forbidden_effects: ["生成交付完成的记录"]
        evidence_hints: ["命令原文与完整输出"]

  - id: SOP-02
    title: 产品变化后的回归
    actor: "独立执行者"
    entry: "tw team scenarios pending、submit、carry"
    must:
      - "产品变化后已通过场景待判定"
      - "受影响的重跑，不受影响的写明理由沿用，统计分开计数"
    scenarios:

      - id: SOP-02-P01
        polarity: positive
        title: 产品变化后重跑一条、沿用一条，交付完成
        actor: 独立执行者
        priority: P0
        refs: ["2.4"]
        verify: cli
        initial_state: ["无检查项目，两条场景已由独立执行者通过，尚未交付"]
        steps: ["修改产品源码中一处不改变 P01、N01 预期的文字（例如版本号）", "运行 tw team scenarios pending", "重跑 P01 并 submit", "为 N01 写沿用文件（reason 写不受影响的理由，scope 写改动范围），运行 tw team scenarios carry", "运行 run、review（逐项复核后提交）、accept、deliver"]
        expected: ["pending 列出两条场景，状态为待判定（undetermined）", "carry 后汇总为 passed 2、carried 1", "评审稿中 N01 的实际结果写明沿用的改动范围与理由", "deliver 的 overall_complete 为 true", "一次通过率不计沿用"]
        forbidden_effects: ["沿用被计为一次执行"]
        evidence_hints: ["命令原文与完整输出", "沿用文件", "评审稿"]

      - id: SOP-02-N01
        polarity: negative
        negative_type: incomplete-input
        title: 沿用缺少理由或对象不是待判定场景时拒绝
        actor: 独立执行者
        priority: P0
        refs: ["2.4"]
        verify: cli
        initial_state: ["同 SOP-02-P01 修改产品源码之后"]
        steps: ["用两行沿用文件运行 tw team scenarios carry：第 1 行缺少 reason 与 scope，第 2 行 reason 为空字符串", "重跑 P01 并 submit 后，对 P01 运行 carry"]
        expected: ["两次 carry 退出码均非 0", "第一次按行号指出第 1 行缺少 reason 与 scope、第 2 行 reason 需要非空", "错误后的下一步指向 scenarios carry", "第二次指出只沿用待判定的场景，并给出 P01 的当前状态"]
        forbidden_effects: ["登记新的轮次"]
        evidence_hints: ["命令原文与完整输出"]

  - id: SOP-03
    title: 代理按标准写方案
    actor: "使用 team-workflow 的代理"
    entry: "只装候选技能的新会话"
    negative_exempt: "本节点验证代理按指引做事，反向情形由 SOP-01、SOP-02 的命令行场景覆盖"
    must:
      - "场景只写业务流程，十几条；细节并入流程场景的预期"
      - "实施沿业务链路分段，交接不要求写测试"
    scenarios:

      - id: SOP-03-P01
        polarity: positive
        title: 跨 5 个仓库的需求写出十几条场景、细节并入流程场景、沿链路分段
        actor: 使用 team-workflow 的代理
        priority: P0
        refs: ["2.1", "2.2", "2.3"]
        verify: skill
        initial_state: ["一个用候选 tw 运行过 tw init --apply 的临时项目，声明 web 与 api 验收入口，没有登记检查；docs/ 下放有在线客服需求与李娜的用例", "新会话只装候选技能"]
        steps: ["对新会话说：/team-workflow 按团队流程为 docs/requirement.md 的在线客服需求写方案、场景文件和用例配对，测试同事李娜的用例在 docs/cases.yaml，这是复杂任务；只写方案与验收材料，不实现，不运行 start"]
        expected: ["场景文件通过 tw team scenarios check，场景总数在 10 到 20 条之间，每条是角色经入口完成的一件业务事", "配对文件中 30 条用例全部归入场景；消息长度、空白、时间格式、签名、请求体字段、重试间隔、截断、超时、排序、未读数等细节用例归入覆盖它的流程场景，相应场景的 expected 写有这些细节；AI 回复超时归入 AI 不可用时的降级场景", "方案的实施任务沿业务链路分段，各段写明接通的起点与终点；第一段只接通访客消息经网关到达主服务、客服在工作台收到并回复这条主链路上的节点，这些节点业务上的反向可随节点一起验收；多名客服的分配等加深场景，以及 AI 回复、无人回复提醒、Webhook 等支线，放在后续段新增的节点里", "方案的实施任务节写明每段实施后经真实入口验收本段场景"]
        forbidden_effects: ["要求实施中编写单元、接口或集成测试，或把用例配对到测试", "按技术层拆分任务", "为每条细节用例各写一条场景", "修改或新增 docs/ 以外的受版本管理或未被忽略的文件"]
        evidence_hints: ["会话记录", "方案、场景文件与配对文件", "scenarios check 输出"]

  - id: SOP-04
    title: 发行
    actor: "维护者"
    entry: "python3 scripts/check_release.py"
    negative_exempt: "发行检查只核对文本与清单，反向由其自身的失败输出体现"
    must:
      - "指令文本在篇幅预算内"
    scenarios:

      - id: SOP-04-P01
        polarity: positive
        title: 发行检查与篇幅预算通过
        actor: 维护者
        priority: P0
        refs: ["3"]
        verify: cli
        initial_state: ["候选版的完整仓库副本"]
        steps: ["运行 python3 scripts/check_release.py"]
        expected: ["退出码为 0", "team-workflow 的 SKILL.md、scenarios.md、onboarding.md 均在预算内"]
        forbidden_effects: ["提高任何篇幅预算"]
        evidence_hints: ["命令原文与完整输出"]
